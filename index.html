<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Picker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🍿 Movie Selection Roulette 🎬</h1>
        <p>Click the button to draw a movie from the available options.</p>

        <div class="movie-list-container">
            <h2>Available Movies (<span id="count-display">9</span>)</h2>
            <ul id="movie-list">
                </ul>
        </div>

        <button id="draw-button">Draw a Movie!</button>

        <div id="selection-result" class="result-box hidden">
            <p><strong>Selected Movie:</strong></p>
            <h3 id="selected-title"></h3>
        </div>

        <button id="reset-button" class="hidden">Reset List</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
